<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAE Programmation Répartie</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/index.css" />
</head>
<body>

<nav class="topnav" aria-label="Navigation principale">
    <a href="index.html" aria-current="page">Carte</a>
    <a href="pages/compte-rendu.html">Compte rendu</a>
</nav>

<div id="app">
    <div id="sidebar">
        <div class="sidebar-header" id="sidebar-title">Stations VéloStan Nancy</div>

        <div class="tabs" role="tablist" aria-label="Type de données à afficher">
            <button type="button" class="tab" role="tab" id="tab-velos"
                    data-tab="velos" aria-controls="list-panel" aria-selected="true">Vélos</button>
            <button type="button" class="tab" role="tab" id="tab-incidents"
                    data-tab="incidents" aria-controls="list-panel" aria-selected="false">Incidents</button>
            <button type="button" class="tab" role="tab" id="tab-restaurants"
                    data-tab="restaurants" aria-controls="list-panel" aria-selected="false">Restaurants</button>
        </div>

        <label for="search" class="sr-only">Rechercher dans la liste</label>
        <input type="text" id="search" placeholder="Rechercher...">

        <div id="list-panel" role="tabpanel" aria-labelledby="tab-velos">
            <div id="station-list"></div>
        </div>
    </div>

    <div id="map" role="application" aria-label="Carte des stations VéloStan de Nancy"></div>
</div>

<script src="dist/index.js" defer></script>
</body>
</html>
