<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAE Programmation Répartie</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/index.css" />
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">Stations VéloStan Nancy</div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="stat-stations">—</div>
            <div class="stat-label">Stations</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-bikes">—</div>
            <div class="stat-label">Vélos dispo</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-docks">—</div>
            <div class="stat-label">Places libres</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-empty">—</div>
            <div class="stat-label">Stations vides</div>
        </div>
    </div>

    <input type="text" id="search" placeholder="Rechercher une station...">

    <div id="station-list"></div>
</div>

<div id="map"></div>

<script src="dist/index.js" defer></script>
</body>
</html>
